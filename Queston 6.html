<!DOCTYPE html>
<html>
<head>
<style>
body  { background-color: blue;
            text-align: center;}
</style>
    <title>Display Date and Time</title>
</head>
<body>

    <h2>Click the Button to Display Date and Time</h2>

    <button onclick="showDateTime()">Show Date & Time</button>

    <h3 id="result"></h3>

    <script>
        function showDateTime() {
            let currentDateTime = new Date();
            document.getElementById("result").innerHTML = currentDateTime;
        }
    </script>

</body>
</html>
